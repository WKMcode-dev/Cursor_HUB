name: Windows portable release
on:
  push:
    branches: [master]
    paths:
      - 'CursorHub/RELEASE_VERSION'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cursorhub-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        run: |
          $version = (Get-Content CursorHub/RELEASE_VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Prepare Kode Mono font
        run: |
          python -m pip install pillow==12.1.0
          New-Item -ItemType Directory -Force CursorHub/Assets/Fonts | Out-Null
          $base = 'https://raw.githubusercontent.com/google/fonts/909667d11fe41a8384294d064950c48c53904d27/ofl/kodemono'
          Invoke-WebRequest "$base/KodeMono%5BROND%2Cwdth%2Cwght%5D.ttf" -OutFile CursorHub/Assets/Fonts/KodeMono.ttf
          Invoke-WebRequest "$base/OFL.txt" -OutFile CursorHub/Assets/Fonts/OFL.txt
          python CursorHub/Tools/Build-Font.py CursorHub/Assets/Fonts
          if ($LASTEXITCODE -ne 0) { throw 'Font generation failed' }
          New-Item -ItemType Directory -Force verification/fonts | Out-Null
          Copy-Item CursorHub/Assets/Fonts/*.fnt,CursorHub/Assets/Fonts/*.png,CursorHub/Assets/Fonts/OFL.txt verification/fonts/
      - name: Run core checks
        run: |
          dotnet run --project CursorHub/Checks/Checks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core checks failed' }
      - name: Publish self-contained Windows x64 application
        run: |
          dotnet publish CursorHub/CursorHub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:Version=$env:RELEASE_VERSION -o dist/CursorHub
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          foreach ($file in @('CursorHub.exe','CursorHub.dll','coreclr.dll','hostfxr.dll','Assets/frame.png','Assets/play.png')) {
            if (!(Test-Path "dist/CursorHub/$file")) { throw "Missing portable dependency: $file" }
          }
          Copy-Item CursorHub/Portable/* dist/CursorHub/
          Copy-Item CursorHub/README.md dist/CursorHub/README-tecnico.md
      - name: Verify packaged UI and desktop overlay
        run: |
          New-Item -ItemType Directory -Force verification | Out-Null
          $output = Join-Path $pwd 'verification'
          $picker = Start-Process dist/CursorHub/CursorHub.exe -ArgumentList "--verify-picker `"$output/picker`"" -PassThru
          if (!$picker.WaitForExit(30000)) { $picker.Kill(); throw 'File picker verification timed out' }
          $pickerResults = Get-Content "$output/picker/picker-results.json" -Raw
          Write-Output $pickerResults
          if ($pickerResults -match 'FAIL' -or $pickerResults -notmatch 'thread MTA') { throw 'File picker verification failed' }
          $probe = Start-Process dist/CursorHub/CursorHub.exe -ArgumentList "--verify-overlay `"$output/overlay`"" -PassThru
          if (!$probe.WaitForExit(30000)) { $probe.Kill(); throw 'Overlay verification timed out' }
          $overlay = Get-Content "$output/overlay/overlay-results.json" -Raw
          Write-Output $overlay
          if ($overlay -match 'FAIL' -or $overlay -notmatch 'PASS worker') { throw 'Overlay verification failed' }
          $ui = Start-Process dist/CursorHub/CursorHub.exe -ArgumentList "--verify-ui `"$output/ui`"" -PassThru -RedirectStandardError "$output/ui-stderr.txt"
          if (!$ui.WaitForExit(60000)) { $ui.Kill(); throw 'UI verification timed out' }
          $results = Get-Content "$output/ui/results.json" -Raw
          Write-Output $results
          if ($results -match 'FAIL' -or $results -notmatch 'Maximizar/restaurar') { throw 'UI verification failed' }
          $dark = Start-Process dist/CursorHub/CursorHub.exe -ArgumentList "--verify-dark-ui `"$output/dark`"" -PassThru -RedirectStandardError "$output/dark-stderr.txt"
          if (!$dark.WaitForExit(60000)) { $dark.Kill(); throw 'Dark UI verification timed out' }
          $darkResults = Get-Content "$output/dark/results.json" -Raw
          Write-Output $darkResults
          if ($darkResults -match 'FAIL' -or $darkResults -notmatch 'Maximizar/restaurar') { throw 'Dark UI verification failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CursorHub-verification
          path: verification/
          retention-days: 14
      - name: Package and checksum
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $name = "CursorHub-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path dist/CursorHub -DestinationPath "artifacts/$name" -CompressionLevel Optimal
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: CursorHub-windows-x64
          path: artifacts/*
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:RELEASE_VERSION" artifacts/* --target "$env:GITHUB_SHA" --title "Cursor Hub $env:RELEASE_VERSION - Windows portatil (x64)" --notes-file CursorHub/RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

# Includes native STA/MTA file-dialog verification and SVG window controls.
